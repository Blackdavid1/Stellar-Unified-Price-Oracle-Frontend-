name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Review cadence: re-run the threat-model drift check weekly.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  threat-model-drift:
    name: Threat model drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify threat model covers all trust boundaries and external origins
        run: node scripts/check-threat-model.mjs

      - name: Verify each mitigation links to code and a test
        run: node scripts/check-threat-model.mjs --require-links
